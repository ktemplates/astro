name: Main

on:
  push:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      ## NOTE: pnpm version comes from package.json packageManager; keep runtime in sync with bun in mise.toml
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: bun@1.4.4
          cache: true
          require-lockfile: true
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run test
